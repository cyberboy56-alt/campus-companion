services:
  - type: web
    name: campus-companion-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: CORS_ORIGINS
        value: https://cyberboy56-alt.github.io
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: campus-companion-data
      mountPath: /var/data
      sizeGB: 1
