services:
  - type: web
    name: campus-companion-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: /tmp/campus-companion
      - key: CORS_ORIGINS
        value: https://cyberboy56-alt.github.io
      - key: OPENAI_MODEL
        value: gpt-4o-mini
