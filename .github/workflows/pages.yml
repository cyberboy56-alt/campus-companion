name: Deploy Campus Companion to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.API_URL != '' }}
    runs-on: ubuntu-latest
    env:
      NEXT_OUTPUT: export
      NEXT_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Require the deployed API URL
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::Set the repository variable API_URL to the deployed FastAPI origin before deploying Pages."
            exit 1
          fi
      - name: Build static frontend
        run: npm --prefix frontend run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    if: ${{ vars.API_URL != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
